<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Galactic Revision - Galaxy Map</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Aurebesh&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap');

:root {
  --coruscant: #4a9eff;
  --tatooine: #ffb84d;
  --naboo: #4dffb8;
  --endor: #7dff4d;
  --kamino: #4dddff;
  --mustafar: #ff4d4d;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Rajdhani', sans-serif;
  background: #000;
  color: #fff;
  overflow: hidden;
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="6" fill="none" stroke="%2300ffff" stroke-width="2"/><circle cx="10" cy="10" r="1" fill="%2300ffff"/></svg>') 10 10, auto;
}

/* ===== CANVAS ===== */
#space {
  position: fixed;
  inset: 0;
  z-index: 1;
}

/* ===== HUD ===== */
.hud {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.hud > * {
  pointer-events: auto;
}

/* TOP BAR */
.top-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 85px;
  background: linear-gradient(180deg, rgba(0,10,30,0.98) 0%, rgba(0,10,30,0.7) 70%, transparent 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  border-bottom: 2px solid rgba(0,255,255,0.15);
  backdrop-filter: blur(10px);
}

.logo {
  font-family: 'Orbitron', sans-serif;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 4px;
  text-shadow: 0 0 30px cyan, 0 0 60px rgba(0,255,255,0.5);
  background: linear-gradient(90deg, #00f5ff, #0080ff, #00f5ff);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 3s linear infinite;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.stats {
  display: flex;
  gap: 35px;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
}

.stat {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0,255,255,0.05);
  padding: 8px 18px;
  border-radius: 25px;
  border: 1px solid rgba(0,255,255,0.2);
  transition: all 0.3s;
}

.stat:hover {
  background: rgba(0,255,255,0.1);
  border-color: cyan;
  box-shadow: 0 0 20px rgba(0,255,255,0.3);
}

.stat-icon {
  font-size: 20px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.15); opacity: 0.8; }
}

/* GALAXY CONTAINER */
.galaxy-container {
  position: absolute;
  inset: 85px 0 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 2000px;
}

.galaxy-map {
  position: relative;
  width: 1100px;
  height: 700px;
  transform-style: preserve-3d;
}

/* ORBITES ANIMÉES */
.orbit {
  position: absolute;
  border: 1px solid rgba(0,255,255,0.1);
  border-radius: 50%;
  pointer-events: none;
  animation: rotate-orbit 120s linear infinite;
}

@keyframes rotate-orbit {
  from { transform: rotateZ(0deg); }
  to { rotateZ(360deg); }
}

.orbit-1 { width: 400px; height: 400px; top: 150px; left: 350px; border-style: dashed; }
.orbit-2 { width: 650px; height: 650px; top: 25px; left: 225px; }
.orbit-3 { width: 900px; height: 900px; top: -100px; left: 100px; border-style: dotted; }

/* PLANÈTES 3D */
.planet {
  position: absolute;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 0 20px currentColor);
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
}

.planet:hover {
  transform: scale(1.2) translateY(-10px) !important;
  z-index: 100;
  filter: drop-shadow(0 0 40px currentColor) drop-shadow(0 0 60px currentColor);
}

.planet-sphere {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  position: relative;
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.4), transparent 60%);
  border: 3px solid currentColor;
  box-shadow: 
    inset 0 0 40px currentColor,
    inset 20px 20px 40px rgba(0,0,0,0.4),
    0 0 60px currentColor;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: all 0.3s;
}

.planet:hover .planet-sphere {
  box-shadow: 
    inset 0 0 60px currentColor,
    inset 20px 20px 60px rgba(0,0,0,0.3),
    0 0 100px currentColor,
    0 0 150px currentColor;
  animation: rotate-sphere 8s linear infinite;
}

@keyframes rotate-sphere {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* TEXTURE PLANÈTE */
.planet-texture {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  opacity: 0.3;
  mix-blend-mode: overlay;
}

.planet-icon {
  font-size: 56px;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}

/* ANNEAUX DE PLANÈTE */
.planet-ring {
  position: absolute;
  border: 2px solid currentColor;
  border-radius: 50%;
  opacity: 0.3;
  pointer-events: none;
}

.ring-1 {
  width: 180px;
  height: 180px;
  top: -20px;
  left: -20px;
  animation: rotate-ring 10s linear infinite;
}

.ring-2 {
  width: 200px;
  height: 200px;
  top: -30px;
  left: -30px;
  animation: rotate-ring 15s linear infinite reverse;
}

@keyframes rotate-ring {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* NOM PLANÈTE */
.planet-name {
  position: absolute;
  bottom: -45px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Orbitron', sans-serif;
  font-size: 18px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 3px;
  white-space: nowrap;
  text-shadow: 0 0 20px currentColor;
  opacity: 0.9;
}

.planet-code {
  position: absolute;
  top: -35px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  font-weight: 600;
  opacity: 0.6;
  letter-spacing: 1px;
  background: rgba(0,0,0,0.6);
  padding: 4px 12px;
  border-radius: 15px;
  border: 1px solid currentColor;
}

/* POSITIONS PLANÈTES */
.planet-coruscant {
  top: 80px;
  left: 120px;
  color: var(--coruscant);
  animation-delay: 0s;
}

.planet-tatooine {
  top: 60px;
  left: 480px;
  color: var(--tatooine);
  animation-delay: 1s;
}

.planet-naboo {
  top: 120px;
  left: 800px;
  color: var(--naboo);
  animation-delay: 2s;
}

.planet-endor {
  top: 400px;
  left: 180px;
  color: var(--endor);
  animation-delay: 3s;
}

.planet-kamino {
  top: 420px;
  left: 550px;
  color: var(--kamino);
  animation-delay: 4s;
}

.planet-mustafar {
  top: 380px;
  left: 850px;
  color: var(--mustafar);
  animation-delay: 5s;
}

/* TEXTURES SPÉCIFIQUES */
.texture-coruscant {
  background: 
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.1) 2px, rgba(255,255,255,0.1) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.1) 2px, rgba(255,255,255,0.1) 4px);
}

.texture-tatooine {
  background: 
    radial-gradient(circle at 20% 80%, rgba(139,69,19,0.3) 0%, transparent 40%),
    radial-gradient(circle at 80% 20%, rgba(139,69,19,0.3) 0%, transparent 40%);
}

.texture-naboo {
  background: 
    radial-gradient(circle at 30% 30%, rgba(0,255,200,0.3) 0%, transparent 50%),
    radial-gradient(circle at 70% 70%, rgba(0,100,255,0.3) 0%, transparent 50%);
}

.texture-endor {
  background: 
    radial-gradient(circle at 40% 40%, rgba(0,100,0,0.4) 0%, transparent 60%),
    radial-gradient(circle at 60% 60%, rgba(0,150,0,0.3) 0%, transparent 50%);
}

.texture-kamino {
  background: 
    linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
  animation: water-flow 3s linear infinite;
}

@keyframes water-flow {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}

.texture-mustafar {
  background: 
    radial-gradient(circle at 50% 50%, rgba(255,100,0,0.4) 0%, transparent 40%),
    radial-gradient(circle at 30% 70%, rgba(255,0,0,0.3) 0%, transparent 30%);
  animation: lava-pulse 2s ease-in-out infinite;
}

@keyframes lava-pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.6; }
}

/* MODAL PLANÈTE */
.planet-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(15px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s;
}

.planet-modal.active {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  width: 700px;
  max-height: 85vh;
  overflow-y: auto;
  background: linear-gradient(135deg, rgba(10,20,40,0.98), rgba(20,10,40,0.98));
  border: 3px solid currentColor;
  border-radius: 25px;
  padding: 45px;
  box-shadow: 0 0 80px currentColor, inset 0 0 60px rgba(0,0,0,0.5);
  animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

@keyframes slideUp {
  from { 
    opacity: 0;
    transform: translateY(100px) scale(0.8);
  }
  to { 
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.modal-header {
  display: flex;
  align-items: center;
  gap: 25px;
  margin-bottom: 35px;
  padding-bottom: 25px;
  border-bottom: 2px solid rgba(255,255,255,0.1);
}

.modal-icon {
  font-size: 80px;
  filter: drop-shadow(0 0 30px currentColor);
}

.modal-titles {
  flex: 1;
}

.modal-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 3px;
  margin-bottom: 8px;
  text-shadow: 0 0 30px currentColor;
}

.modal-subtitle {
  font-size: 16px;
  opacity: 0.7;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 600;
}

.modal-description {
  background: rgba(0,0,0,0.4);
  padding: 20px;
  border-radius: 15px;
  border-left: 4px solid currentColor;
  margin-bottom: 30px;
  font-size: 16px;
  line-height: 1.8;
}

.topics-list {
  margin: 30px 0;
  display: grid;
  gap: 15px;
}

.topic-item {
  background: rgba(255,255,255,0.03);
  border: 2px solid rgba(255,255,255,0.1);
  padding: 20px 25px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.3s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.topic-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 4px;
  background: currentColor;
  transform: scaleY(0);
  transition: transform 0.3s;
}

.topic-item:hover {
  background: rgba(255,255,255,0.08);
  border-color: currentColor;
  transform: translateX(8px);
  box-shadow: 0 5px 25px rgba(0,0,0,0.3);
}

.topic-item:hover::before {
  transform: scaleY(1);
}

.topic-name {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.modal-actions {
  display: flex;
  gap: 18px;
  margin-top: 35px;
}

.btn {
  flex: 1;
  padding: 18px;
  border: none;
  border-radius: 15px;
  font-family: 'Orbitron', sans-serif;
  font-size: 15px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s;
}

.btn:hover::before {
  transform: translateX(100%);
}

.btn-primary {
  background: linear-gradient(135deg, currentColor, color-mix(in srgb, currentColor, black 30%));
  color: white;
  box-shadow: 0 0 30px currentColor;
  border: 2px solid currentColor;
}

.btn-primary:hover {
  box-shadow: 0 0 50px currentColor, 0 0 80px currentColor;
  transform: translateY(-3px);
}

.btn-secondary {
  background: rgba(255,255,255,0.05);
  color: white;
  border: 2px solid rgba(255,255,255,0.3);
}

.btn-secondary:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.5);
}

/* INTRO ANIMATION */
.intro-overlay {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 35px;
  animation: fadeOut 1s 2.5s forwards;
}

@keyframes fadeOut {
  to { opacity: 0; pointer-events: none; }
}

.intro-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 56px;
  font-weight: 900;
  letter-spacing: 12px;
  background: linear-gradient(90deg, #00f5ff, #7a00ff, #ff00ff, #00f5ff);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 4s linear infinite;
  text-shadow: 0 0 60px rgba(0,245,255,0.5);
}

.intro-subtitle {
  font-size: 20px;
  opacity: 0.8;
  letter-spacing: 4px;
  animation: pulse-text 2s infinite;
}

@keyframes pulse-text {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* RESPONSIVE */
@media (max-width: 1200px) {
  .galaxy-map {
    transform: scale(0.8);
  }
}

@media (max-width: 768px) {
  .top-bar {
    padding: 0 20px;
  }
  
  .logo {
    font-size: 20px;
  }
  
  .stats {
    font-size: 12px;
    gap: 15px;
  }
  
  .galaxy-map {
    transform: scale(0.5);
  }
  
  .modal-content {
    width: 90%;
    padding: 30px;
  }
}
</style>
</head>

<!-- INTRO -->
<div class="intro-overlay">
  <div class="intro-text">BIENVENUE</div>
  <div class="intro-subtitle">Exploration de la galaxie académique...</div>
</div>

<!-- CANVAS THREE.JS -->
<canvas id="space"></canvas>

<!-- HUD -->
<div class="hud">
  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="logo">MASTER GALACTIQUE</div>
    <div class="stats">
      <div class="stat">

          <div class="planet-texture texture-coruscant"></div>

      <!-- PLANÈTE 2: TATOOINE -->
      <div class="planet planet-tatooine" data-planet="tatooine">

        </div>

      <!-- PLANÈTE 4: ENDOR -->
      <div class="planet planet-endor" data-planet="endor">

      <!-- PLANÈTE 5: KAMINO -->
      <div class="planet planet-kamino" data-planet="kamino">

          <div class="planet-texture texture-kamino"></div>
          <div class="planet-icon">🌊</div>
        </div>
        <div class="planet-name">Kamino</div>
      </div>

      <!-- PLANÈTE 6: MUSTAFAR -->
      <div class="planet planet-mustafar" data-planet="mustafar">
        <div class="planet-code">MGSI 412</div>
        <div class="planet-sphere">
          <div class="planet-texture texture-mustafar"></div>
          <div class="planet-icon">🌋</div>
        </div>
        <div class="planet-name">Mustafar</div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL PLANÈTE -->
<div class="planet-modal" id="planetModal">
  <div class="modal-content" id="modalContent">
    <div class="modal-header">
      <div class="modal-icon" id="modalIcon">🏛️</div>
      <div class="modal-titles">
        <div class="modal-title" id="modalTitle">Coruscant</div>
        <div class="modal-subtitle" id="modalSubtitle">FING 4210</div>
      </div>
    </div>

    <div class="modal-description" id="modalDescription">
      Description de la planète et du module...
    </div>

    <div class="topics-list" id="topicsList">
      <!-- Rempli dynamiquement -->
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary" id="startRevision">Commencer les révisions</button>
      <button class="btn btn-secondary" id="closeModal">Retour à la galaxie</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>

    description: "Monde aquatique de la technologie avancée. Architecture et stratégie des systèmes d'information.",
    topics: [
      "Architecture SI",
      "Alignement stratégique",
      "Gouvernance IT",
      "Schéma directeur",
      "Urbanisation du SI",
      "Management de projet SI"
    ]
  },
  mustafar: {
    name: "Mustafar",
    code: "MGSI 412",
    fullName: "SI, implantation",
    icon: "🌋",
    color: "#ff4d4d",
    description: "Planète volcanique de l'implémentation. Déploiement et mise en œuvre des systèmes d'information.",
    topics: [
      "Gestion de projet",
      "Déploiement SI",
      "Conduite du changement",
      "Tests et recette",
      "Formation utilisateurs",
      "Maintenance et support"
    ]
  }
};

/* ================= SCÈNE THREE.JS ================= */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 3000);
camera.position.z = 40;

const renderer = new THREE.WebGLRenderer({ canvas: space, alpha: true, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);

/* LUMIÈRES */
scene.add(new THREE.AmbientLight(0x4466ff, 0.4));

const sunLight = new THREE.PointLight(0x00ffff, 1.5, 150);
sunLight.position.set(0, 0, 30);
scene.add(sunLight);

const backLight = new THREE.PointLight(0xff00ff, 0.8, 200);
backLight.position.set(-50, 30, -50);
scene.add(backLight);

/* ÉTOILES */
const starsGeo = new THREE.BufferGeometry();
const starsPos = [];
const starsColors = [];
for (let i = 0; i < 10000; i++) {
  starsPos.push(
    (Math.random() - 0.5) * 2000,
    (Math.random() - 0.5) * 2000,
    Math.random() * -1500 - 100
  );
  
  const color = new THREE.Color();
  color.setHSL(Math.random() * 0.3 + 0.5, 0.8, Math.random() * 0.5 + 0.5);
  starsColors.push(color.r, color.g, color.b);
}
starsGeo.setAttribute("position", new THREE.Float32BufferAttribute(starsPos, 3));
starsGeo.setAttribute("color", new THREE.Float32BufferAttribute(starsColors, 3));

const stars = new THREE.Points(
  starsGeo,
  new THREE.PointsMaterial({ 
    size: 1.5,
    vertexColors: true,
    transparent: true,
    opacity: 0.8
  })
);
scene.add(stars);

/* NÉBULEUSES COLORÉES */
const nebulae = [];
const nebulaColors = [0x4a9eff, 0xffb84d, 0x4dffb8, 0x7dff4d, 0x4dddff, 0xff4d4d];

for (let i = 0; i < 6; i++) {
  const nebulaGeo = new THREE.SphereGeometry(60, 32, 32);
  const nebulaMat = new THREE.MeshBasicMaterial({
    color: nebulaColors[i],
    transparent: true,
    opacity: 0.04,
    side: THREE.BackSide
  });
  const nebula = new THREE.Mesh(nebulaGeo, nebulaMat);
  nebula.position.set(
    (Math.random() - 0.5) * 300,
    (Math.random() - 0.5) * 300,
    -Math.random() * 300 - 100
  );
  scene.add(nebula);
  nebulae.push(nebula);
}

/* ANIMATION */
function animate() {
  requestAnimationFrame(animate);

  // Rotation douce
  stars.rotation.y += 0.0001;
  stars.rotation.x += 0.00005;

  // Nébuleuses
  nebulae.forEach((n, i) => {
    n.rotation.x += 0.0003 * (i + 1);
    n.rotation.y += 0.0002 * (i + 1);
  });

  renderer.render(scene, camera);
}
animate();

/* RESIZE */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= INTERACTIONS PLANÈTES ================= */
const planetModal = document.getElementById("planetModal");
const modalContent = document.getElementById("modalContent");
const modalIcon = document.getElementById("modalIcon");
const modalTitle = document.getElementById("modalTitle");
const modalSubtitle = document.getElementById("modalSubtitle");
const modalDescription = document.getElementById("modalDescription");
const topicsList = document.getElementById("topicsList");
const closeModal = document.getElementById("closeModal");
const startRevision = document.getElementById("startRevision");

let currentPlanet = null;

// Clic sur une planète
document.querySelectorAll(".planet").forEach(planet => {
  planet.addEventListener("click", () => {
    const planetId = planet.dataset.planet;
    currentPlanet = planetId;
    showPlanetModal(planetId);
  });
});

function showPlanetModal(planetId) {
  const data = planetsData[planetId];
  
  // Appliquer la couleur au modal
  modalContent.style.borderColor = data.color;
  modalContent.style.boxShadow = `0 0 80px ${data.color}, inset 0 0 60px rgba(0,0,0,0.5)`;
  modalContent.style.color = data.color;
  
  modalIcon.textContent = data.icon;
  modalTitle.textContent = data.name;
  modalSubtitle.textContent = `${data.code} - ${data.fullName}`;
  modalDescription.textContent = data.description;
  
  // Afficher les topics
  topicsList.innerHTML = data.topics.map((topic, index) => `
    <div class="topic-item" style="animation-delay: ${index * 0.05}s">
      <div class="topic-name">${topic}</div>
    </div>
  `).join('');
  
  planetModal.classList.add("active");
}

closeModal.addEventListener("click", () => {
  planetModal.classList.remove("active");
});

startRevision.addEventListener("click", () => {
  window.location.href = `revision.html?planet=${currentPlanet}`;
});

// Fermer modal en cliquant en dehors
planetModal.addEventListener("click", (e) => {
  if (e.target === planetModal) {
    planetModal.classList.remove("active");
  }
});

/* ================= PROGRESSION ================= */
function updateGlobalProgress() {
  const progress = localStorage.getItem("galacticProgress");
  if (progress) {
    const data = JSON.parse(progress);
    let totalCompleted = 0;
    Object.values(data).forEach(planet => {
      totalCompleted += planet.completed || 0;
    });
    const avgProgress = Math.round(totalCompleted / 6);
    document.getElementById("globalProgress").textContent = `${avgProgress}%`;
  }
}

updateGlobalProgress();

// Simuler une série
document.getElementById("streak").textContent = Math.floor(Math.random() * 15) + 1;
</script>
